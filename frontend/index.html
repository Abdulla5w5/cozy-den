<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches the light theme (the default). Kept in sync with the toggle by
         the theme effect in App.tsx. -->
    <meta name="theme-color" content="#fffaf1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Tab icon. The den mark alone, not the full lockup — the wordmark is
         unreadable at 16px. Sat on the brand cream rather than left
         transparent, because the mark is near-black and would disappear
         against a dark tab bar. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Cozy Den — Board Game Café</title>
    <meta name="description" content="Board game café in Kuwait. Book a table, browse the game library and the menu." />

    <!-- Link previews (WhatsApp, Instagram, X…). Without these, apps fall back
         to the app icon and crop it. The image keeps the logo inside its
         centre square, so apps that crop to a square still show it whole. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cozy Den" />
    <meta property="og:title" content="Cozy Den — Board Game Café" />
    <meta property="og:description" content="Board game café in Kuwait. Book a table, browse the game library and the menu." />
    <meta property="og:url" content="https://cozyden.com.kw/" />
    <meta property="og:image" content="https://cozyden.com.kw/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Cozy Den logo: a panda asleep on a den" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
